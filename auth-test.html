<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ALVIS 認証テスト</title>
  <style>
    body {
      background: #101827;
      color: white;
      font-family: sans-serif;
      padding: 24px;
    }
    input, button {
      box-sizing: border-box;
      width: 100%;
      padding: 14px;
      margin-top: 12px;
      border-radius: 8px;
      font-size: 16px;
    }
    input { background: #fff; color: #111; }
    button { background: #38bdf8; border: 0; }
    #result { margin-top: 20px; }
  </style>
</head>
<body>
  <h2>ALVIS 認証テスト</h2>
  <p>Cloudflare Workerとの接続を確認するよ。</p>

  <input
    id="token"
    type="password"
    autocomplete="off"
    placeholder="ALVIS_SYNC_TOKENを入力"
  >

  <button id="testButton">認証テスト</button>
  <p id="result">待機中</p>

  <script>
    const tokenInput = document.getElementById("token");
    const result = document.getElementById("result");

    document.getElementById("testButton").addEventListener("click", async () => {
      const token = tokenInput.value.trim();

      if (!token) {
        result.textContent = "トークンを入力してね。";
        return;
      }

      result.textContent = "認証中…";

      try {
        const response = await fetch(
          "https://alvis-sync.dokodemodoa100.workers.dev/auth-check",
          {
            method: "GET",
            headers: {
              "Authorization": "Bearer " + token
            },
            cache: "no-store"
          }
        );

        const data = await response.json();

        result.textContent = data.ok
          ? "成功！ALVISの認証が通ったよ。"
          : "失敗：" + (data.message || "認証エラー");

      } catch (error) {
        result.textContent = "通信エラー。WorkerのCORS設定を確認する必要があるよ。";
      } finally {
        tokenInput.value = "";
      }
    });
  </script>
</body>
</html>

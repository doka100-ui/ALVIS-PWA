
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ALVIS 同期テスト</title>
  <style>
    body {
      font-family: sans-serif;
      max-width: 640px;
      margin: 30px auto;
      padding: 0 16px;
      line-height: 1.6;
    }
    input, button {
      box-sizing: border-box;
      width: 100%;
      padding: 12px;
      margin: 6px 0 14px;
      font-size: 16px;
    }
    button { cursor: pointer; }
    pre {
      background: #f2f2f2;
      padding: 12px;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }
    .note { color: #555; font-size: 14px; }
    h2 { margin-top: 28px; }
    .production { border-left: 4px solid #16834a; padding-left: 12px; }
    .vault { border-left: 4px solid #1769aa; padding-left: 12px; }
  </style>
</head>
<body>
  <h1>ALVIS 同期テスト</h1>
  <p class="note">
    テスト専用ページです。保存するのはランダムなダミーデータのみです。
    トークンは保存されません。
  </p>

  <label for="token">同期トークン</label>
  <input id="token" type="password" autocomplete="off"
         placeholder="Cloudflare Workerのトークン">

  <h2>KVテスト（従来方式）</h2>
  <button id="load">テストデータを読み込む</button>
  <button id="save">ダミーデータを保存する</button>
  <button id="conflict">競合検出をテストする</button>

  <h2>Durable Objectテスト（既存テスト領域）</h2>
  <button id="do-load">DOテストデータを読み込む</button>
  <button id="do-save">DOにダミーデータを保存する</button>
  <button id="do-conflict">DOの競合検出をテストする</button>

  <h2 class="production">本番用Durable Objectテスト</h2>
  <p class="note">
    保存先は alvis-main です。実際のALVIS記憶データは使用しません。
  </p>
  <button id="main-load">本番領域の状態を読み込む</button>
  <button id="main-save">本番領域にダミーデータを保存する</button>
  <button id="main-conflict">本番領域の競合検出をテストする</button>

  <h2 class="vault">ALVIS専用保存領域（alvis-vault）</h2>
  <p class="note">
    実際のALVIS同期用に新設した領域です。
    既存のテスト領域とは分離されています。
  </p>
  <button id="vault-load">ALVIS専用領域の状態を読み込む</button>
  <button id="vault-save">ALVIS専用領域にダミーデータを保存する</button>
  <button id="vault-conflict">ALVIS専用領域の競合検出をテストする</button>

  <h2>結果</h2>
  <pre id="result">まだテストしていません。</pre>

  <script>
    const WORKER_URL =
      "https://alvis-sync.dokodemodoa100.workers.dev";

    let currentRevision = 0;
    let doCurrentRevision = 0;
    let mainCurrentRevision = 0;
    let vaultCurrentRevision = 0;

    const result = document.getElementById("result");

    function show(value) {
      result.textContent =
        typeof value === "string"
          ? value
          : JSON.stringify(value, null, 2);
    }

    function getToken() {
      const token = document.getElementById("token").value.trim();
      if (!token) throw new Error("トークンを入力してください。");
      return token;
    }

    function makeDummyRecord() {
      const salt = new Uint8Array(16);
      const iv = new Uint8Array(12);
      const encrypted = new Uint8Array(32);

      crypto.getRandomValues(salt);
      crypto.getRandomValues(iv);
      crypto.getRandomValues(encrypted);

      return {
        version: 1,
        salt: Array.from(salt),
        iv: Array.from(iv),
        encrypted: Array.from(encrypted)
      };
    }

    async function api(path, options = {}) {
      const token = getToken();

      const response = await fetch(WORKER_URL + path, {
        ...options,
        headers: {
          "Authorization": "Bearer " + token,
          ...(options.body ? { "Content-Type": "application/json" } : {}),
          ...(options.headers || {})
        }
      });

      const data = await response.json();
      return { status: response.status, data };
    }

    async function loadTest(path, setRevision, label) {
      try {
        show(label + "を読み込み中...");
        const response = await api(path);

        if (response.data.ok) {
          setRevision(response.data.revision);
        }

        show({
          status: response.status,
          ...response.data
        });
      } catch (error) {
        show("エラー: " + error.message);
      }
    }

    async function saveTest(path, getRevision, setRevision, label) {
      try {
        show(label + "にダミーデータを保存中...");

        const response = await api(path, {
          method: "POST",
          body: JSON.stringify({
            version: 1,
            expectedRevision: getRevision(),
            encryptedRecord: makeDummyRecord()
          })
        });

        if (response.data.ok) {
          setRevision(response.data.revision);
        }

        show({
          status: response.status,
          ...response.data
        });
      } catch (error) {
        show("エラー: " + error.message);
      }
    }

    async function conflictTest(path, getRevision, label) {
      try {
        show(label + "の競合検出をテスト中...");

        const revision = getRevision();
        const staleRevision = revision === 0 ? 1 : revision - 1;

        const response = await api(path, {
          method: "POST",
          body: JSON.stringify({
            version: 1,
            expectedRevision: staleRevision,
            encryptedRecord: makeDummyRecord()
          })
        });

        show({
          status: response.status,
          ...response.data
        });
      } catch (error) {
        show("エラー: " + error.message);
      }
    }

    // KVテスト
    document.getElementById("load").addEventListener("click", () =>
      loadTest("/sync/test-load", v => currentRevision = v, "KV")
    );

    document.getElementById("save").addEventListener("click", () =>
      saveTest(
        "/sync/test-save",
        () => currentRevision,
        v => currentRevision = v,
        "KV"
      )
    );

    document.getElementById("conflict").addEventListener("click", () =>
      conflictTest("/sync/test-save", () => currentRevision, "KV")
    );

    // 既存DOテスト
    document.getElementById("do-load").addEventListener("click", () =>
      loadTest("/sync/do-test-load", v => doCurrentRevision = v, "DOテスト領域")
    );

    document.getElementById("do-save").addEventListener("click", () =>
      saveTest(
        "/sync/do-test-save",
        () => doCurrentRevision,
        v => doCurrentRevision = v,
        "DOテスト領域"
      )
    );

    document.getElementById("do-conflict").addEventListener("click", () =>
      conflictTest(
        "/sync/do-test-save",
        () => doCurrentRevision,
        "DOテスト領域"
      )
    );

    // 本番用DOテスト（alvis-main）
    document.getElementById("main-load").addEventListener("click", () =>
      loadTest(
        "/sync/main-load",
        v => mainCurrentRevision = v,
        "本番用DO領域"
      )
    );

    document.getElementById("main-save").addEventListener("click", () =>
      saveTest(
        "/sync/main-save",
        () => mainCurrentRevision,
        v => mainCurrentRevision = v,
        "本番用DO領域"
      )
    );

    document.getElementById("main-conflict").addEventListener("click", () =>
      conflictTest(
        "/sync/main-save",
        () => mainCurrentRevision,
        "本番用DO領域"
      )
    );

    // ALVIS専用保存領域（alvis-vault）
    document.getElementById("vault-load").addEventListener("click", () =>
      loadTest(
        "/sync/vault-load",
        v => vaultCurrentRevision = v,
        "ALVIS専用領域"
      )
    );

    document.getElementById("vault-save").addEventListener("click", () =>
      saveTest(
        "/sync/vault-save",
        () => vaultCurrentRevision,
        v => vaultCurrentRevision = v,
        "ALVIS専用領域"
      )
    );

    document.getElementById("vault-conflict").addEventListener("click", () =>
      conflictTest(
        "/sync/vault-save",
        () => vaultCurrentRevision,
        "ALVIS専用領域"
      )
    );
  </script>
</body>
</html>

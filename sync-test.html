<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ALVIS 同期テスト</title>
  <style>
    body {
      font-family: sans-serif;
      max-width: 640px;
      margin: 30px auto;
      padding: 0 16px;
      line-height: 1.6;
    }
    input, button {
      box-sizing: border-box;
      width: 100%;
      padding: 12px;
      margin: 6px 0 14px;
      font-size: 16px;
    }
    button { cursor: pointer; }
    pre {
      background: #f2f2f2;
      padding: 12px;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }
    .note { color: #555; font-size: 14px; }
    h2 { margin-top: 28px; }
  </style>
</head>
<body>
  <h1>ALVIS 同期テスト</h1>
  <p class="note">
    このページはテスト専用です。本番データは使用しません。
    入力したトークンは保存されません。
  </p>

  <label for="token">同期トークン</label>
  <input id="token" type="password" autocomplete="off"
         placeholder="Cloudflare Workerのトークン">

  <h2>KVテスト（従来方式）</h2>
  <button id="load">テストデータを読み込む</button>
  <button id="save">ダミーデータを保存する</button>
  <button id="conflict">競合検出をテストする</button>

  <h2>Durable Objectテスト（新方式）</h2>
  <button id="do-load">DOテストデータを読み込む</button>
  <button id="do-save">DOにダミーデータを保存する</button>
  <button id="do-conflict">DOの競合検出をテストする</button>

  <h2>結果</h2>
  <pre id="result">まだテストしていません。</pre>

  <script>
    const WORKER_URL =
      "https://alvis-sync.dokodemodoa100.workers.dev";

    let currentRevision = 0;
    let doCurrentRevision = 0;

    const result = document.getElementById("result");

    function show(value) {
      result.textContent =
        typeof value === "string"
          ? value
          : JSON.stringify(value, null, 2);
    }

    function getToken() {
      const token = document.getElementById("token").value.trim();
      if (!token) throw new Error("トークンを入力してください。");
      return token;
    }

    function makeDummyRecord() {
      const salt = new Uint8Array(16);
      const iv = new Uint8Array(12);
      const encrypted = new Uint8Array(32);

      crypto.getRandomValues(salt);
      crypto.getRandomValues(iv);
      crypto.getRandomValues(encrypted);

      return {
        version: 1,
        salt: Array.from(salt),
        iv: Array.from(iv),
        encrypted: Array.from(encrypted)
      };
    }

    async function api(path, options = {}) {
      const token = getToken();

      const response = await fetch(WORKER_URL + path, {
        ...options,
        headers: {
          "Authorization": "Bearer " + token,
          ...(options.body ? { "Content-Type": "application/json" } : {}),
          ...(options.headers || {})
        }
      });

      const data = await response.json();
      return { status: response.status, data };
    }

    // KV: 読み込み
    document.getElementById("load").addEventListener("click", async () => {
      try {
        show("KVデータを読み込み中...");
        const response = await api("/sync/test-load");

        if (response.data.ok) {
          currentRevision = response.data.revision;
        }

        show({
          status: response.status,
          ...response.data
        });
      } catch (error) {
        show("エラー: " + error.message);
      }
    });

    // KV: 保存
    document.getElementById("save").addEventListener("click", async () => {
      try {
        show("KVにダミーデータを保存中...");

        const response = await api("/sync/test-save", {
          method: "POST",
          body: JSON.stringify({
            version: 1,
            expectedRevision: currentRevision,
            encryptedRecord: makeDummyRecord()
          })
        });

        if (response.data.ok) {
          currentRevision = response.data.revision;
        }

        show({
          status: response.status,
          ...response.data
        });
      } catch (error) {
        show("エラー: " + error.message);
      }
    });

    // KV: 競合検出
    document.getElementById("conflict").addEventListener("click", async () => {
      try {
        show("KVの競合検出をテスト中...");

        const staleRevision =
          currentRevision === 0 ? 1 : currentRevision - 1;

        const response = await api("/sync/test-save", {
          method: "POST",
          body: JSON.stringify({
            version: 1,
            expectedRevision: staleRevision,
            encryptedRecord: makeDummyRecord()
          })
        });

        show({
          status: response.status,
          ...response.data
        });
      } catch (error) {
        show("エラー: " + error.message);
      }
    });

    // Durable Object: 読み込み
    document.getElementById("do-load").addEventListener("click", async () => {
      try {
        show("Durable Objectデータを読み込み中...");
        const response = await api("/sync/do-test-load");

        if (response.data.ok) {
          doCurrentRevision = response.data.revision;
        }

        show({
          status: response.status,
          ...response.data
        });
      } catch (error) {
        show("エラー: " + error.message);
      }
    });

    // Durable Object: 保存
    document.getElementById("do-save").addEventListener("click", async () => {
      try {
        show("Durable Objectにダミーデータを保存中...");

        const response = await api("/sync/do-test-save", {
          method: "POST",
          body: JSON.stringify({
            version: 1,
            expectedRevision: doCurrentRevision,
            encryptedRecord: makeDummyRecord()
          })
        });

        if (response.data.ok) {
          doCurrentRevision = response.data.revision;
        }

        show({
          status: response.status,
          ...response.data
        });
      } catch (error) {
        show("エラー: " + error.message);
      }
    });

    // Durable Object: 競合検出
    document.getElementById("do-conflict").addEventListener("click", async () => {
      try {
        show("Durable Objectの競合検出をテスト中...");

        const staleRevision =
          doCurrentRevision === 0 ? 1 : doCurrentRevision - 1;

        const response = await api("/sync/do-test-save", {
          method: "POST",
          body: JSON.stringify({
            version: 1,
            expectedRevision: staleRevision,
            encryptedRecord: makeDummyRecord()
          })
        });

        show({
          status: response.status,
          ...response.data
        });
      } catch (error) {
        show("エラー: " + error.message);
      }
    });
  </script>
</body>
</html>

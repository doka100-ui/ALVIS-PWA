<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>ALVIS 更新</title>
  <style>
    :root{color-scheme:dark;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#061426;color:#eaf6ff}
    body{min-height:100svh;display:grid;place-items:center;margin:0;padding:24px;box-sizing:border-box}
    main{width:min(100%,440px);padding:28px;border:1px solid #24577a;border-radius:18px;background:#0a2038;box-shadow:0 12px 48px #0008}
    h1{font-size:20px;letter-spacing:.08em;margin:0 0 18px}
    p{line-height:1.7;color:#c6dced}
    #status{color:#8de4ff;font-weight:600}
    button{width:100%;padding:14px;border:1px solid #4a9bc5;border-radius:10px;background:#123b5b;color:#fff;font-size:16px}
  </style>
</head>
<body>
<main>
  <h1>ALVIS SYSTEM UPDATE</h1>
  <p id="status">Service Workerの更新を確認しています…</p>
  <p>記憶・会話履歴・Qwenモデルの保存データには触れません。</p>
  <button id="retry" type="button" hidden>もう一度確認</button>
</main>
<script>
(() => {
  const status=document.getElementById("status");
  const retry=document.getElementById("retry");
  const target="./index-integrated.html?refresh=312";
  const withTimeout=(promise,timeout,message)=>Promise.race([
    promise,
    new Promise((_,reject)=>setTimeout(()=>reject(new Error(message)),timeout))
  ]);
  const wait=(worker,timeout=25000)=>new Promise((resolve,reject)=>{
    if(worker.state==="activated"){resolve();return;}
    if(worker.state==="redundant"){reject(new Error("新しいWorkerの準備に失敗しました"));return;}
    let done=false;
    const finish=(error)=>{
      if(done)return;done=true;clearTimeout(timer);
      worker.removeEventListener("statechange",change);
      error?reject(error):resolve();
    };
    const change=()=>{
      if(worker.state==="activated")finish();
      else if(worker.state==="redundant")finish(new Error("新しいWorkerの準備に失敗しました"));
    };
    const timer=setTimeout(()=>finish(new Error("新しいWorkerの有効化に時間がかかっています。再試行してください")),timeout);
    worker.addEventListener("statechange",change);change();
  });
  async function update(){
    retry.hidden=true;
    try{
      if(!("serviceWorker" in navigator))throw new Error("このブラウザはService Workerに対応していません");
      status.textContent="登録済みWorkerを確認しています…";
      // Re-apply updateViaCache:none even when an older registration already exists.
      // Existing registrations retain their previous update policy unless register()
      // is called again with the new options.
      const registration=await withTimeout(
        navigator.serviceWorker.register("./service-worker.js",{updateViaCache:"none"}),
        12000,
        "Worker登録の更新に時間がかかっています。再試行してください"
      );
      status.textContent="最新のアプリ更新を取得しています…";
      await withTimeout(
        registration.update(),
        15000,
        "更新確認がタイムアウトしました。通信状態を確認して再試行してください"
      );
      let worker=registration.installing||registration.waiting;
      if(!worker){
        await new Promise(resolve=>{
          const timer=setTimeout(resolve,4000);
          registration.addEventListener("updatefound",()=>{clearTimeout(timer);resolve();},{once:true});
        });
        worker=registration.installing||registration.waiting;
      }
      if(worker){
        status.textContent="新しいALVISを有効化しています…";
        await wait(worker);
      }else if(!registration.active||registration.active.state!=="activated"){
        throw new Error("新しいWorkerを確認できませんでした。再試行してください");
      }
      status.textContent="新しいWorkerの実バージョンを確認しています…";
      const activeWorker=registration.active;
      if(!activeWorker||activeWorker.state!=="activated")throw new Error("更新後のWorkerが有効化されていません");
      const workerVersion=await withTimeout(new Promise((resolve,reject)=>{
        const channel=new MessageChannel();
        channel.port1.onmessage=event=>{
          channel.port1.close();
          resolve(event.data?.cacheName||"");
        };
        try{activeWorker.postMessage({type:"ALVIS_GET_BUILD_INFO"},[channel.port2]);}
        catch(error){channel.port1.close();reject(error);}
      }),3050,"Workerのバージョン応答がありません");
      if(workerVersion!=="alvis-cache-v312-integrated"){
        throw new Error("最新版を確認できません。検出したWorker："+(workerVersion||"不明"));
      }
      status.textContent="v312を確認しました。ALVISを開いています…";
      location.replace(target);
    }catch(error){
      status.textContent="更新できませんでした："+String(error?.message||error);
      retry.hidden=false;
    }
  }
  retry.addEventListener("click",update);
  update();
})();
</script>
</body>
</html>

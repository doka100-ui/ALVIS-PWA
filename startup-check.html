<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<title>ALVIS 起動診断</title>
<style>
:root{color-scheme:dark;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#061426;color:#eaf6ff}
*{box-sizing:border-box}body{margin:0;padding:16px;min-height:100svh}
main{max-width:760px;margin:0 auto}h1{font-size:20px}p{color:#bfd5e8;line-height:1.6}
#status{color:#8de4ff;font-weight:600}
#report{white-space:pre-wrap;overflow-wrap:anywhere;padding:14px;border:1px solid #28516d;border-radius:10px;background:#091d31;font:12px/1.55 ui-monospace,monospace;min-height:120px}
button{width:100%;padding:13px;margin:8px 0;border:1px solid #4a9bc5;border-radius:10px;background:#123b5b;color:#fff;font-size:16px}
#appFrame{display:block;width:100%;height:min(72svh,760px);border:1px solid #28516d;border-radius:12px;background:#07182a;margin:14px 0}
small{color:#9db4c8}
</style>
</head>
<body>
<main>
<h1>ALVIS 起動時間チェック</h1>
<p>このページ内でALVISを実際に開き、ログイン画面が見えるまでの時間と、この端末のService Worker/アプリキャッシュ情報だけを確認します。記憶・履歴・パスワード・Qwenモデルの中身は読み取りません。</p>
<div id="status">ALVISの起動を計測しています…</div>
<iframe id="appFrame" title="ALVIS login startup measurement"></iframe>
<button id="copy" type="button">診断結果をコピー</button>
<pre id="report">計測中…</pre>
<small>計測が終わったら「診断結果をコピー」を押して、このチャットへ貼り付けてください。</small>
</main>
<script>
(() => {
  const frame=document.getElementById("appFrame");
  const status=document.getElementById("status");
  const output=document.getElementById("report");
  const started=performance.now();
  let loginVisibleMs=null;
  let finished=false;
  let pollId=0;
  const report={
    page:"ALVIS startup diagnostic",
    browser:navigator.userAgent,
    diagnosticPageLoadedMs:Math.round(started),
    appUrl:new URL("./index-integrated.html",location.href).pathname,
    loginVisibleMs:null,
    appNavigation:{},
    serviceWorker:{},
    appCaches:[]
  };
  const write=()=>{output.textContent=JSON.stringify(report,null,2);};
  const inspect=async()=>{
    try{
      const doc=frame.contentDocument;
      if(doc){
        const lock=doc.getElementById("lockPanel");
        if(lock&&!lock.classList.contains("hidden")&&lock.getBoundingClientRect().width>0&&!finished){
          finished=true;
          loginVisibleMs=Math.round(performance.now()-started);
          report.loginVisibleMs=loginVisibleMs;
          status.textContent="ログイン画面を確認しました。計測完了。";
          const nav=frame.contentWindow.performance.getEntriesByType("navigation")[0];
          if(nav)report.appNavigation={
            responseStartMs:Math.round(nav.responseStart),
            domInteractiveMs:Math.round(nav.domInteractive),
            domContentLoadedMs:Math.round(nav.domContentLoadedEventEnd),
            loadEventEndMs:Math.round(nav.loadEventEnd||0),
            transferSize:nav.transferSize,
            encodedBodySize:nav.encodedBodySize
          };
          const sw=frame.contentWindow.navigator.serviceWorker;
          if(sw){
            const controller=sw.controller;
            const registration=await sw.getRegistration();
            report.serviceWorker={
              controlled:!!controller,
              controllerUrl:controller?.scriptURL||null,
              activeState:registration?.active?.state||null,
              waitingState:registration?.waiting?.state||null,
              installingState:registration?.installing?.state||null
            };
          }
          if("caches" in frame.contentWindow){
            report.appCaches=(await frame.contentWindow.caches.keys()).filter(k=>k.startsWith("alvis-cache-")||k.startsWith("alvis-deps-"));
          }
          try{
            const response=await frame.contentWindow.fetch("./service-worker.js?startup-check="+Date.now(),{cache:"no-store"});
            const source=await response.text();
            report.deployedWorkerCache=(source.match(/alvis-cache-v\\d+-integrated/)||[])[0]||"version not found";
            report.workerFetchStatus=response.status;
          }catch(error){report.workerFetchError=String(error?.message||error);}
          write();
          cancelAnimationFrame(pollId);
          return;
        }
      }
    }catch(error){report.frameInspectionError=String(error?.message||error);}
    if(!finished)pollId=requestAnimationFrame(inspect);
  };
  frame.addEventListener("error",()=>{status.textContent="ALVIS画面を読み込めませんでした。";report.frameError=true;write();});
  frame.src="./index-integrated.html?startup-check="+Date.now();
  pollId=requestAnimationFrame(inspect);
  frame.addEventListener("load",()=>{if(!finished){status.textContent="画面の読み込み完了を確認中…";requestAnimationFrame(inspect);}});
  document.getElementById("copy").addEventListener("click",async()=>{
    const value=JSON.stringify(report,null,2);
    try{await navigator.clipboard.writeText(value);status.textContent="診断結果をコピーしました。チャットに貼り付けてください。";}
    catch(error){output.focus?.();status.textContent="下の診断結果を長押ししてコピーしてください。";}
  });
  setTimeout(()=>{if(!finished){status.textContent="ログイン画面の表示をまだ確認できません。計測を続けています…";report.timeoutAfterMs=20000;write();}},20000);
})();
</script>
</body>
</html>

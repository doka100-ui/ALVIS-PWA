<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101827">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="./manifest.json">
  <title>ALVIS</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: #101827;
      color: #f1f5f9;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    }

    header {
      padding: 18px;
      border-bottom: 1px solid #334155;
      background: #172235;
    }

    header h1 {
      margin: 0;
      letter-spacing: 3px;
      font-size: 22px;
    }

    .status {
      margin-top: 6px;
      color: #86efac;
      font-size: 12px;
    }

    #chat {
      height: calc(100dvh - 155px);
      overflow-y: auto;
      padding: 18px;
    }

    .message {
      max-width: 85%;
      margin: 12px 0;
      padding: 13px 16px;
      border-radius: 16px;
      line-height: 1.6;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .alvis {
      background: #1e293b;
      border: 1px solid #334155;
      margin-right: auto;
    }

    .user {
      background: #2563eb;
      margin-left: auto;
    }

    .sender {
      font-size: 11px;
      color: #94a3b8;
      margin-bottom: 5px;
    }

    .input-area {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      display: flex;
      gap: 8px;
      padding: 12px;
      padding-bottom: max(12px, env(safe-area-inset-bottom));
      background: #172235;
      border-top: 1px solid #334155;
    }

    input {
      flex: 1;
      min-width: 0;
      padding: 14px;
      border: 1px solid #475569;
      border-radius: 12px;
      background: #0f172a;
      color: white;
      font-size: 16px;
      outline: none;
    }

    button {
      padding: 0 20px;
      border: 0;
      border-radius: 12px;
      background: #2563eb;
      color: white;
      font-size: 15px;
      font-weight: bold;
    }

    button:active {
      background: #1d4ed8;
    }
  </style>
</head>

<body>
  <header>
    <h1>ALVIS</h1>
    <div class="status" id="status">● 起動しています</div>
  </header>

  <main id="chat">
    <div class="message alvis">
      <div class="sender">ALVIS</div>
      こんにちは。ALVISだよ。
      今日は何を一緒に進めようか？
    </div>
  </main>

  <div class="input-area">
    <input
      id="messageInput"
      type="text"
      placeholder="ALVISにメッセージを送る..."
      autocomplete="off"
    >
    <button id="sendButton">送信</button>
  </div>

  <script>
    const chat = document.getElementById("chat");
    const input = document.getElementById("messageInput");
    const sendButton = document.getElementById("sendButton");

    function addMessage(text, type) {
      const message = document.createElement("div");
      message.className = "message " + type;

      const sender = document.createElement("div");
      sender.className = "sender";
      sender.textContent = type === "user" ? "あなた" : "ALVIS";

      const content = document.createElement("div");
      content.textContent = text;

      message.appendChild(sender);
      message.appendChild(content);
      chat.appendChild(message);

      chat.scrollTop = chat.scrollHeight;
    }

    function sendMessage() {
      const text = input.value.trim();

      if (!text) return;

      addMessage(text, "user");
      input.value = "";

      setTimeout(() => {
        addMessage(
          "メッセージを受け取ったよ。現在はチャット画面の試作段階なんだ。これからAIモデルと長期記憶を接続していくね。",
          "alvis"
        );
      }, 300);
    }

    sendButton.addEventListener("click", sendMessage);

    input.addEventListener("keydown", (event) => {
      if (event.key === "Enter") {
        sendMessage();
      }
    });

    if ("serviceWorker" in navigator) {
      window.addEventListener("load", async () => {
        try {
          await navigator.serviceWorker.register("./service-worker.js");
          document.getElementById("status").textContent =
            "● オフライン機能を準備しました";
        } catch (error) {
          document.getElementById("status").textContent =
            "● オフライン設定を確認してください";
        }
      });
    }
  </script>
</body>
</html>

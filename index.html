<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101827">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>ALVIS</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 24px;
      background: #101827;
      color: #f1f5f9;
      font-family: sans-serif;
    }
    main {
      max-width: 600px;
      margin: 40px auto;
    }
    h1 { letter-spacing: 3px; }
    .status {
      color: #86efac;
      font-size: 14px;
    }
    .panel {
      margin-top: 24px;
      padding: 20px;
      border: 1px solid #334155;
      border-radius: 16px;
      background: #1e293b;
    }
  </style>
</head>
<body>
  <main>
    <h1>ALVIS</h1>
    <p class="status">● ローカル記憶システム準備中</p>
    <section class="panel">
      <h2>こんにちは。</h2>
      <p>ALVISだよ。今日は何を一緒に進めようか？</p>
      <p>ここから、オフラインで使える長期記憶システムを作っていくよ。</p>
    </section>
  </main>
</body>
</html>

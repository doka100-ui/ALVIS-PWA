<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <meta name="theme-color" content="#061426">
  <title>ALVIS 更新</title>
  <style>
    :root{color-scheme:dark;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#061426;color:#eaf6ff}
    body{min-height:100svh;display:grid;place-items:center;margin:0;padding:24px;box-sizing:border-box}
    main{width:min(100%,440px);padding:28px;border:1px solid #24577a;border-radius:18px;background:#0a2038;box-shadow:0 12px 48px #0008}
    h1{font-size:20px;letter-spacing:.08em;margin:0 0 18px}
    p{line-height:1.7;color:#c6dced}
    #status{color:#8de4ff;font-weight:600}
    button,a{display:block;width:100%;box-sizing:border-box;text-align:center;padding:14px;border:1px solid #4a9bc5;border-radius:10px;background:#123b5b;color:#fff;font-size:16px;text-decoration:none}
    a{margin-top:10px}
  </style>
</head>
<body>
<main>
  <h1>ALVIS SYSTEM UPDATE</h1>
  <p id="status">ALVISの更新状態を確認しています…</p>
  <p>記憶・会話履歴・暗号化バックアップ・Qwenモデルの保存データは消去しません。</p>
  <button id="retry" type="button" hidden>もう一度確認</button>
  <a id="open" href="./index-integrated.html" hidden>ALVISを開く</a>
</main>
<script>
(() => {
  const status=document.getElementById("status");
  const retry=document.getElementById("retry");
  const open=document.getElementById("open");
  const target="./index-integrated.html";
  const withTimeout=(promise,timeout,message)=>Promise.race([
    promise,
    new Promise((_,reject)=>setTimeout(()=>reject(new Error(message)),timeout))
  ]);
  const waitForActivation=(worker,timeout=30000)=>new Promise((resolve,reject)=>{
    if(worker.state==="activated"){resolve();return;}
    if(worker.state==="redundant"){reject(new Error("新しいWorkerの準備に失敗しました"));return;}
    let done=false;
    const finish=error=>{
      if(done)return;done=true;clearTimeout(timer);
      worker.removeEventListener("statechange",change);
      error?reject(error):resolve();
    };
    const change=()=>{
      if(worker.state==="activated")finish();
      else if(worker.state==="redundant")finish(new Error("新しいWorkerの準備に失敗しました"));
    };
    const timer=setTimeout(()=>finish(new Error("更新の有効化に時間がかかっています。再試行してください")),timeout);
    worker.addEventListener("statechange",change);change();
  });
  async function getBuildInfo(worker){
    return withTimeout(new Promise((resolve,reject)=>{
      const channel=new MessageChannel();
      const timer=setTimeout(()=>{channel.port1.close();reject(new Error("Workerから応答がありません"));},3000);
      channel.port1.onmessage=event=>{
        clearTimeout(timer);channel.port1.close();
        resolve(event.data?.cacheName||"");
      };
      try{worker.postMessage({type:"ALVIS_GET_BUILD_INFO"},[channel.port2]);}
      catch(error){clearTimeout(timer);channel.port1.close();reject(error);}
    }),3500,"Workerの確認がタイムアウトしました");
  }
  async function update(){
    retry.hidden=true;open.hidden=true;
    try{
      if(!("serviceWorker" in navigator))throw new Error("このブラウザはService Workerに対応していません");
      status.textContent="登録済みWorkerを確認しています…";
      let registration=await withTimeout(navigator.serviceWorker.getRegistration("./"),8000,"登録確認がタイムアウトしました");
      if(!registration)registration=await withTimeout(
        navigator.serviceWorker.register("./service-worker.js",{updateViaCache:"none"}),
        12000,"Worker登録がタイムアウトしました"
      );
      status.textContent="最新の更新を取得しています…";
      await withTimeout(registration.update(),20000,"更新確認がタイムアウトしました。通信状態を確認してください");
      let installing=registration.installing||registration.waiting;
      if(installing){
        status.textContent="新しいALVISを有効化しています…";
        await waitForActivation(installing);
      }else if(!registration.active||registration.active.state!=="activated"){
        throw new Error("有効なALVIS Workerを確認できませんでした");
      }
      const active=registration.active;
      if(!active||active.state!=="activated")throw new Error("更新後のWorkerが有効化されていません");
      const cacheName=await getBuildInfo(active);
      if(!/^alvis-cache-v\d+-integrated$/.test(cacheName)){
        throw new Error("ALVISのビルド情報を確認できませんでした（"+(cacheName||"応答なし")+"）");
      }
      status.textContent="最新のALVISを確認しました。アプリを開いています…";
      location.replace(target);
    }catch(error){
      status.textContent="自動更新を確認できませんでした："+String(error?.message||error);
      retry.hidden=false;open.hidden=false;
    }
  }
  retry.addEventListener("click",update);
  update();
})();
</script>
</body>
</html>

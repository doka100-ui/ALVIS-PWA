<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#080d18">
<title>ALVIS Avatar Studio — Local Prototype</title>
<style>
:root{color-scheme:dark;--bg:#080d18;--panel:#111a2b;--line:#263650;--cyan:#79d9ec;--muted:#9aabc2}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#edf5ff;font:15px system-ui,-apple-system,sans-serif}
header{padding:16px 18px;border-bottom:1px solid var(--line)}h1{font-size:19px;margin:0 0 5px}p{margin:0;color:var(--muted);line-height:1.55}
main{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:14px;padding:14px;max-width:1200px;margin:auto}
#stage{height:min(72vh,720px);min-height:390px;background:radial-gradient(ellipse at 50% 38%,#23344e,#0b1220 68%);border:1px solid var(--line);border-radius:16px;overflow:hidden;position:relative;touch-action:none}
#stage canvas{display:block;width:100%;height:100%}.hint{position:absolute;left:12px;bottom:10px;color:#b8c9dc;font-size:12px;pointer-events:none}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:15px;align-self:start}
.panel h2{font-size:15px;margin:0 0 12px}.control{margin:0 0 15px}.control label{display:flex;justify-content:space-between;gap:8px;font-size:13px;margin-bottom:7px}.control output{color:var(--cyan);font-variant-numeric:tabular-nums}
input[type=range]{width:100%;accent-color:var(--cyan);min-height:28px}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
button{border:1px solid #38506d;background:#1b2b43;color:#f1f7ff;border-radius:10px;padding:12px 9px;font-weight:600;min-height:44px}
button.primary{background:#174b61;border-color:#39849a}.status{font-size:12px;color:#b7cadc;margin-top:12px;min-height:36px;white-space:pre-wrap}
.notice{font-size:12px;border-top:1px solid var(--line);margin-top:14px;padding-top:12px;color:#9aabc2}
@media(max-width:760px){main{grid-template-columns:1fr;padding:10px}#stage{height:54vh;min-height:330px}.panel{width:100%}}
</style>
<script type="importmap">
{"imports":{"three":"./vendor/three.module.js","three/addons/":"./vendor/"}}
</script>
</head>
<body>
<header><h1>ALVIS Avatar Studio</h1><p>ローカル3D造形プロトタイプ — 外部画像生成・画像アップロードなし</p></header>
<main>
<section id="stage" aria-label="3D顔モデルプレビュー"><div class="hint">ドラッグ：回転 ／ ピンチ・ホイール：拡大縮小</div></section>
<aside class="panel">
<h2>顔のプロポーション調整</h2>
<div class="control"><label for="faceWidth">顔幅 <output id="faceWidthValue">1.00</output></label><input id="faceWidth" type="range" min=".82" max="1.18" step=".01" value="1"></div>
<div class="control"><label for="faceLength">顔の縦長さ <output id="faceLengthValue">1.00</output></label><input id="faceLength" type="range" min=".88" max="1.16" step=".01" value="1"></div>
<div class="control"><label for="eyeSize">目の大きさ <output id="eyeSizeValue">1.00</output></label><input id="eyeSize" type="range" min=".82" max="1.2" step=".01" value="1"></div>
<div class="control"><label for="eyeSpacing">目の間隔 <output id="eyeSpacingValue">1.00</output></label><input id="eyeSpacing" type="range" min=".85" max="1.18" step=".01" value="1"></div>
<div class="control"><label for="noseSize">鼻の立体感 <output id="noseSizeValue">1.00</output></label><input id="noseSize" type="range" min=".7" max="1.35" step=".01" value="1"></div>
<div class="control"><label for="mouthSize">唇の幅 <output id="mouthSizeValue">1.00</output></label><input id="mouthSize" type="range" min=".75" max="1.3" step=".01" value="1"></div>
<div class="control"><label for="blink">まぶたを閉じる <output id="blinkValue">0.00</output></label><input id="blink" type="range" min="0" max="1" step=".01" value="0"></div>
<div class="control"><label for="smile">微笑み <output id="smileValue">0.00</output></label><input id="smile" type="range" min="0" max="1" step=".01" value="0"></div>
<div class="control"><label for="sad">悲しみ <output id="sadValue">0.00</output></label><input id="sad" type="range" min="0" max="1" step=".01" value="0"></div>
<div class="control"><label for="angry">怒り <output id="angryValue">0.00</output></label><input id="angry" type="range" min="0" max="1" step=".01" value="0"></div>
<div class="control"><label for="surprised">驚き <output id="surprisedValue">0.00</output></label><input id="surprised" type="range" min="0" max="1" step=".01" value="0"></div>
<div class="control"><label for="relaxed">自然な表情 <output id="relaxedValue">0.00</output></label><input id="relaxed" type="range" min="0" max="1" step=".01" value="0"></div>
<div class="control"><label for="aa">母音 aa <output id="aaValue">0.00</output></label><input id="aa" type="range" min="0" max="1" step=".01" value="0"></div>
<div class="control"><label for="ih">母音 ih <output id="ihValue">0.00</output></label><input id="ih" type="range" min="0" max="1" step=".01" value="0"></div>
<div class="control"><label for="ou">母音 ou <output id="ouValue">0.00</output></label><input id="ou" type="range" min="0" max="1" step=".01" value="0"></div>
<div class="control"><label for="ee">母音 ee <output id="eeValue">0.00</output></label><input id="ee" type="range" min="0" max="1" step=".01" value="0"></div>
<div class="control"><label for="oh">母音 oh <output id="ohValue">0.00</output></label><input id="oh" type="range" min="0" max="1" step=".01" value="0"></div>
<div class="actions"><button id="reset">初期値に戻す</button><button id="front">正面を見る</button><button class="primary" id="export" style="grid-column:1/-1">VRM 1.0を書き出し</button></div>
<div class="status" id="status" role="status">準備完了。各スライダーで形状を調整できます。</div>
<div class="notice">これは手続き生成のVRM 1.0骨格・表情データ付き試作です。18号の顔一致や完成品質は未確認です。調整値はこのページ内だけで扱い、既存ALVISデータへ保存しません。</div>
</aside>
</main>

import * as THREE from "three";

const host=document.querySelector("#stage"), status=document.querySelector("#status");
const scene=new THREE.Scene(); scene.background=new THREE.Color(0x0b1220);
const camera=new THREE.PerspectiveCamera(32,1,.1,100);camera.position.set(0,.15,7.2);

renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.05;host.appendChild(renderer.domElement);
const controls=new OrbitControls(camera,renderer.domElement);controls.enableDamping=true;controls.target.set(0,.05,0);controls.minDistance=4.5;controls.maxDistance=10;

const key=new THREE.DirectionalLight(0xffe8d5,3.0);key.position.set(-3,4,5);scene.add(key);
const rim=new THREE.DirectionalLight(0x8acbff,2.1);rim.position.set(3,2,-4);scene.add(rim);
const root=new THREE.Group();scene.add(root);
const mat=(color,rough=.65,metal=0)=>new THREE.MeshStandardMaterial({color,roughness:rough,metalness:metal});
const skin=mat(0xf0cbb8,.72),skinShade=mat(0xd9a995,.8),hair=mat(0xe5c276,.48),hairLight=mat(0xf2d99a,.48),white=mat(0xf8f4ef,.7),iris=mat(0x8198a7,.28),pupil=mat(0x263644,.25),lip=mat(0xb96f72,.55),dark=mat(0x493a36,.8),gold=mat(0xc6a15a,.3,.7),eyeGlint=mat(0xffffff,.2),browMat=mat(0x493a36,.8);
let faceGroup;
function ell(parent,material,pos,scale,seg=32){const m=new THREE.Mesh(new THREE.SphereGeometry(1,seg,Math.max(16,Math.floor(seg*.7))),material);m.position.set(...pos);m.scale.set(...scale);parent.add(m);return m}

function addBrowMorphTargets(mesh,side){
 const base=mesh.geometry.attributes.position;
 const targets=["angry","sad","surprised"].map(shape=>{
  const target=base.clone();
  for(let i=0;i<target.count;i++){
   const outward=THREE.MathUtils.clamp((target.getX(i)-side*.37)*side/.22,0,1);
   const shift=shape==="angry"?(outward*.075-(1-outward)*.065):shape==="sad"?(.065*(1-outward)-outward*.055):.075;
   target.setY(i,target.getY(i)+shift);
  }
  return target;
 });
 mesh.geometry.morphAttributes.position=targets;
 mesh.geometry.userData.targetNames=["angry","sad","surprised"];
 mesh.updateMorphTargets();
 mesh.morphTargetDictionary={angry:0,sad:1,surprised:2};
}
function addEyeGazeMorphTargets(mesh){
 const base=mesh.geometry.attributes.position;
 const dx=.018/Math.max(mesh.scale.x,.001),dy=.018/Math.max(mesh.scale.y,.001);
 const targets=[
  ["lookUp",0,dy],["lookDown",0,-dy],["lookLeft",-dx,0],["lookRight",dx,0]
 ].map(([name,x,y])=>{
  const target=base.clone();
  for(let i=0;i<target.count;i++){target.setX(i,target.getX(i)+x);target.setY(i,target.getY(i)+y);}
  return target;
 });
 mesh.geometry.morphAttributes.position=targets;
 mesh.geometry.userData.targetNames=targets.map((_,index)=>["lookUp","lookDown","lookLeft","lookRight"][index]);
 mesh.updateMorphTargets();
 mesh.morphTargetDictionary={lookUp:0,lookDown:1,lookLeft:2,lookRight:3};
}
function makeFace(){
 faceGroup=new THREE.Group();root.add(faceGroup);
 // Sculpted oval base; the lower jaw tapers toward the chin.
 const geo=new THREE.SphereGeometry(1,64,48);const pos=geo.attributes.position;
 for(let i=0;i<pos.count;i++){const y=pos.getY(i),x=pos.getX(i),z=pos.getZ(i);const taper=.78+.22*((y+1)/2);const cheek=1+.055*Math.exp(-Math.pow((y-.02)/.24,2));const depth=.94+.06*((y+1)/2)+.035*Math.exp(-Math.pow((y+.02)/.3,2));pos.setXYZ(i,x*taper*cheek,y,z*depth);}
 geo.computeVertexNormals();const skull=new THREE.Mesh(geo,skin);skull.scale.set(.88,1.23,.72);skull.position.y=.08;faceGroup.add(skull);
 // ears
 for(const side of [-1,1]){ell(faceGroup,skin,[side*.88,.02,-.01],[.17,.29,.13]);ell(faceGroup,skinShade,[side*.94,.02,.075],[.065,.16,.035]);}
 // eye sockets, whites, irises and upper/lower lids
 const eyesGroup=new THREE.Group();eyesGroup.name="facial-eyes";faceGroup.add(eyesGroup);
 for(const side of [-1,1]){
  const x=side*.37;

  ell(eyesGroup,white,[x,.34,.675],[.225,.115,.07]);
  const irisMesh=ell(eyesGroup,iris,[x,.34,.735],[.078,.084,.025]);irisMesh.name=side<0?"iris-left":"iris-right";addEyeGazeMorphTargets(irisMesh);
  const pupilMesh=ell(eyesGroup,pupil,[x,.34,.755],[.037,.052,.014]);pupilMesh.name=side<0?"pupil-left":"pupil-right";addEyeGazeMorphTargets(pupilMesh);
  const glintMesh=ell(eyesGroup,eyeGlint,[x-.018,.375,.77],[.018,.018,.008],16);glintMesh.name=side<0?"eye-glint-left":"eye-glint-right";addEyeGazeMorphTargets(glintMesh);

  curve(eyesGroup,[[x-.20,.29,.71],[x,.255,.73],[x+.20,.29,.71]],.012,skinShade);
  const brow=curve(eyesGroup,[[x-.20,.56,.61],[x-.08,.61,.67],[x+.08,.59,.67],[x+.20,.54,.61]],.027,browMat);brow.name=side<0?"eyebrow-left":"eyebrow-right";addBrowMorphTargets(brow,side);

  for(let i=0;i<lidBase.count;i++)lidBase.setY(i,lidBase.getY(i)*.012);

  lidGeometry.userData.targetNames=["blink"];
  const lid=new THREE.Mesh(lidGeometry,skin);lid.morphTargetDictionary={blink:0};lid.position.set(x,.34,.785);lid.scale.set(.225,.12,.035);lid.name=side<0?"eyelid-left":"eyelid-right";eyesGroup.add(lid);
 }
 // nose bridge and tip, nostrils
 const noseGroup=new THREE.Group();noseGroup.name="facial-nose";faceGroup.add(noseGroup);
 ell(noseGroup,skin,[0,.04,.68],[.105,.30,.16]);
 ell(noseGroup,skin,[0,-.13,.79],[.15,.105,.13]);
 for(const side of [-1,1])ell(noseGroup,skinShade,[side*.105,-.17,.77],[.055,.04,.055],20);
 // lips
 const mouthGroup=new THREE.Group();mouthGroup.name="facial-mouth";faceGroup.add(mouthGroup);
 const lipGeometry=new THREE.SphereGeometry(1,32,20);
 const lipBase=lipGeometry.attributes.position.clone();
 const makeLipTarget=(shape)=>{const target=lipBase.clone();for(let i=0;i<target.count;i++){const x=target.getX(i),y=target.getY(i),edge=Math.abs(x);let next=y;if(shape==="happy")next+=edge*.42;else if(shape==="sad")next-=edge*.34;else if(shape==="surprised")next+=(1-edge)*.48;else if(shape==="angry")next+=edge*.20-(1-edge)*.12;else if(shape==="relaxed")next+=edge*.08;target.setY(i,next);}return target;};
 const lipTargets=["happy","sad","angry","surprised","relaxed"].map(makeLipTarget);
 lipGeometry.morphAttributes.position=lipTargets;
 lipGeometry.userData.targetNames=["happy","sad","angry","surprised","relaxed"];
 const upperLip=new THREE.Mesh(lipGeometry,lip);upperLip.morphTargetDictionary={happy:0,sad:1,angry:2,surprised:3,relaxed:4};upperLip.position.set(0,-.43,.66);upperLip.scale.set(.22,.055,.045);upperLip.name="upper-lip";mouthGroup.add(upperLip);
 const mouthInteriorGeometry=new THREE.SphereGeometry(1,32,20);
 const mouthInteriorBase=mouthInteriorGeometry.attributes.position.clone();
 const visemeScales={aa:[1,3.8],ih:[1.45,1.55],ou:[.62,2.6],ee:[1.7,1.2],oh:[.82,3.1]};
 const visemeTargets=Object.entries(visemeScales).map(([name,scale])=>{
  const target=mouthInteriorBase.clone();
  for(let i=0;i<target.count;i++){target.setX(i,target.getX(i)*scale[0]);target.setY(i,target.getY(i)*scale[1]);}
  return target;
 });
 mouthInteriorGeometry.morphAttributes.position=visemeTargets;
 mouthInteriorGeometry.userData.targetNames=Object.keys(visemeScales);
 const mouthInterior=new THREE.Mesh(mouthInteriorGeometry,dark);
 mouthInterior.morphTargetDictionary={aa:0,ih:1,ou:2,ee:3,oh:4};
 mouthInterior.position.set(0,-.465,.625);mouthInterior.scale.set(.17,.045,.022);mouthInterior.name="mouth-viseme-interior";mouthGroup.add(mouthInterior);
 const lowerLipGeometry=new THREE.SphereGeometry(1,32,20);
 const lowerLipBase=lowerLipGeometry.attributes.position.clone();
 const lowerLipTargets=Object.entries({aa:[1,.48],ih:[1.02,.12],ou:[.82,.24],ee:[1.18,.08],oh:[.9,.30]}).map(([name,shape])=>{
  const target=lowerLipBase.clone();
  for(let i=0;i<target.count;i++){target.setX(i,target.getX(i)*shape[0]);target.setY(i,target.getY(i)-Math.max(0,1-Math.abs(target.getX(i)))*shape[1]);}
  return target;
 });
 lowerLipGeometry.morphAttributes.position=lowerLipTargets;
 lowerLipGeometry.userData.targetNames=["aa","ih","ou","ee","oh"];
 const lowerLip=new THREE.Mesh(lowerLipGeometry,lip);
 lowerLip.morphTargetDictionary={aa:0,ih:1,ou:2,ee:3,oh:4};
 lowerLip.position.set(0,-.50,.655);lowerLip.scale.set(.17,.026,.035);lowerLip.name="lower-lip";mouthGroup.add(lowerLip);
 // Layered bob: rear volume, crown cap, swept fringe, and separate tapered strand curves.

 cap.scale.set(.94,1.28,.78);cap.position.set(0,.25,-.015);cap.name="hair-crown";faceGroup.add(cap);
 const fringe=ell(faceGroup,hairLight,[-.18,.72,.49],[.57,.20,.28]);fringe.rotation.z=-.24;fringe.rotation.y=-.15;fringe.name="hair-swept-fringe";
 // Fine curved ribbons create a visible side part and layered front strands without a solid helmet look.
 curve(faceGroup,[[-.58,.79,.55],[-.36,.91,.61],[-.10,.91,.61],[.18,.83,.57],[.39,.69,.49]],.035,hair);
 curve(faceGroup,[[-.42,.82,.58],[-.22,.88,.63],[.04,.83,.62],[.28,.70,.54],[.48,.52,.43]],.024,hairLight);
 curve(faceGroup,[[-.24,.88,.60],[-.02,.84,.64],[.20,.73,.59],[.39,.55,.49],[.52,.34,.39]],.022,hair);
 for(const side of [-1,1]){
  const lock=ell(faceGroup,hair,[side*.77,-.03,.05],[.22,.82,.34]);lock.rotation.z=side*-.08;lock.name=side<0?"hair-side-left":"hair-side-right";

 }
 // Neck and upper-body geometry are separate rigid parts for the humanoid rig.

 const bust=ell(faceGroup,white,[0,-1.65,-.02],[.83,.42,.39]);bust.scale.y=.42;bust.name="upper-body";
 const necklaceTop=curve(faceGroup,[[-.22,-1.25,.23],[0,-1.32,.29],[.22,-1.25,.23]],.018,gold);necklaceTop.name="necklace-chain";
 // Small pendant and the subtle barcode-like neck mark from the approved appearance brief.
 const necklaceLoop=curve(faceGroup,[[-.22,-1.25,.23],[-.15,-1.34,.27],[0,-1.39,.29],[.15,-1.34,.27],[.22,-1.25,.23]],.009,gold);necklaceLoop.name="necklace-loop";
 const pendant=new THREE.Mesh(new THREE.SphereGeometry(.035,20,16),gold);pendant.position.set(0,-1.405,.30);pendant.scale.set(.72,1.25,.35);pendant.name="necklace-pendant";faceGroup.add(pendant);
 [0,.009,.021,.034,.049].forEach((offset,index)=>{const width=[.006,.003,.008,.004,.006][index];const bar=new THREE.Mesh(new THREE.BoxGeometry(width,.043,.006),dark);bar.position.set(.19+offset,-1.12,.247);bar.name="neck-mark-"+index;faceGroup.add(bar);});
 for(const side of [-1,1]){const ring=new THREE.Mesh(new THREE.TorusGeometry(.09,.018,8,24),gold);ring.position.set(side*.95,-.12,.02);ring.rotation.y=Math.PI/2;ring.name=side<0?"earring-left":"earring-right";faceGroup.add(ring);}

 // but the required humanoid joints remain available for compatible runtimes.

 const bones={};
 const addBone=(name,parent,position)=>{const bone=new THREE.Bone();bone.name=name;bone.position.set(...position);(parent||rigRoot).add(bone);bones[name]=bone;return bone;};
 const hips=addBone("hips",null,[0,-1.58,0]);
 const spine=addBone("spine",hips,[0,.28,0]);
 const chest=addBone("chest",spine,[0,.30,0]);
 const neckBone=addBone("neck",chest,[0,.35,0]);

 for(const side of [-1,1]){
  const prefix=side<0?"left":"right";
  const shoulder=addBone(prefix+"Shoulder",chest,[side*.20,.12,0]);
  const upperArm=addBone(prefix+"UpperArm",shoulder,[side*.15,0,0]);
  const lowerArm=addBone(prefix+"LowerArm",upperArm,[side*.28,0,0]);
  addBone(prefix+"Hand",lowerArm,[side*.24,0,0]);
  const upperLeg=addBone(prefix+"UpperLeg",hips,[side*.10,-.08,0]);

  addBone(prefix+"Foot",lowerLeg,[0,-.42,.06]);

makeFace();
const sliders=["faceWidth","faceLength","eyeSize","eyeSpacing","noseSize","mouthSize","blink","smile","sad","angry","surprised","relaxed","aa","ih","ou","ee","oh"];
const defaults={faceWidth:1,faceLength:1,eyeSize:1,eyeSpacing:1,noseSize:1,mouthSize:1,blink:0,smile:0,sad:0,angry:0,surprised:0,relaxed:0,aa:0,ih:0,ou:0,ee:0,oh:0};
function rebuild(){
 const values=Object.fromEntries(sliders.map(id=>[id,Number(document.getElementById(id).value)]));
 root.remove(faceGroup);faceGroup.traverse(o=>{if(o.geometry)o.geometry.dispose()});makeFace();
 faceGroup.scale.set(values.faceWidth,values.faceLength,1);
 const eyes=faceGroup.getObjectByName("facial-eyes");eyes.scale.x=values.eyeSize;eyes.children.forEach(o=>{o.position.x*=values.eyeSpacing;});
 ["eyebrow-left","eyebrow-right"].forEach(name=>{const brow=eyes.getObjectByName(name);if(brow?.morphTargetInfluences){brow.morphTargetInfluences[0]=values.angry;brow.morphTargetInfluences[1]=values.sad;brow.morphTargetInfluences[2]=values.surprised;}});

function attachVrm10Extension(glbData){
 const source=new Uint8Array(glbData);
 const view=new DataView(source.buffer,source.byteOffset,source.byteLength);
 if(source.byteLength<20||view.getUint32(0,true)!==0x46546c67||view.getUint32(4,true)!==2)throw new Error("GLB 2.0として読み取れません");
 const chunks=[];let offset=12;
 while(offset<source.byteLength){
  const length=view.getUint32(offset,true),type=view.getUint32(offset+4,true);
  if(offset+8+length>source.byteLength)throw new Error("GLBチャンクが破損しています");
  chunks.push({type,data:source.slice(offset+8,offset+8+length)});offset+=8+length;
 }
 const jsonChunk=chunks.find(chunk=>chunk.type===0x4e4f534a);
 if(!jsonChunk)throw new Error("GLB JSONチャンクがありません");
 const gltf=JSON.parse(new TextDecoder().decode(jsonChunk.data).trim());
 const nodeIndices=new Map((gltf.nodes||[]).map((node,index)=>[node.name,index]));
 const requiredBones=["hips","spine","head","leftUpperLeg","leftLowerLeg","leftFoot","rightUpperLeg","rightLowerLeg","rightFoot","leftUpperArm","leftLowerArm","leftHand","rightUpperArm","rightLowerArm","rightHand"];
 const humanBones={};
 for(const name of requiredBones){if(!nodeIndices.has(name))throw new Error("Humanoidボーンが不足しています: "+name);humanBones[name]={node:nodeIndices.get(name)};}
 for(const name of ["chest","neck","leftShoulder","rightShoulder"])if(nodeIndices.has(name))humanBones[name]={node:nodeIndices.get(name)};
 const expressions={preset:{}};
 const presetNames=["happy","angry","sad","relaxed","surprised","aa","ih","ou","ee","oh","blink","lookUp","lookDown","lookLeft","lookRight"];
 for(const preset of presetNames){
  const morphTargetBinds=[];
  (gltf.nodes||[]).forEach((node,nodeIndex)=>{
   if(node.mesh===undefined)return;
   const names=gltf.meshes?.[node.mesh]?.extras?.targetNames||[];
   names.forEach((name,index)=>{if(name===preset)morphTargetBinds.push({node:nodeIndex,index,weight:1});});
  });
  if(morphTargetBinds.length)expressions.preset[preset]={morphTargetBinds};
 }
 for(const required of ["blink","happy","angry","sad","surprised","aa","ih","ou","ee","oh","lookUp","lookDown","lookLeft","lookRight"])if(!expressions.preset[required])throw new Error("VRM表情モーフが不足しています: "+required);
 gltf.extensions=gltf.extensions||{};
 gltf.extensions.VRMC_vrm={
  specVersion:"1.0",
  meta:{name:"ALVIS Face Prototype",version:"0.1.0",authors:["ALVIS Project"],licenseUrl:"https://vrm.dev/licenses/1.0/",avatarPermission:"everyone",commercialUsage:"personalNonProfit",creditNotation:"unnecessary",allowRedistribution:false,modification:"allowModification"},
  humanoid:{humanBones},
  lookAt:{type:"expression",offsetFromHeadBone:[0,.05,0],rangeMapHorizontalInner:{inputMaxValue:90,outputScale:1},rangeMapHorizontalOuter:{inputMaxValue:90,outputScale:1},rangeMapVerticalDown:{inputMaxValue:90,outputScale:1},rangeMapVerticalUp:{inputMaxValue:90,outputScale:1}},
  expressions
 };
 gltf.extensionsUsed=[...new Set([...(gltf.extensionsUsed||[]),"VRMC_vrm"])];
 gltf.extensionsRequired=[...new Set([...(gltf.extensionsRequired||[]),"VRMC_vrm"])];
 const jsonBytes=new TextEncoder().encode(JSON.stringify(gltf));
 const jsonPaddedLength=(jsonBytes.length+3)&~3;
 const paddedJson=new Uint8Array(jsonPaddedLength);paddedJson.fill(0x20);paddedJson.set(jsonBytes);
 chunks[chunks.indexOf(jsonChunk)]={type:0x4e4f534a,data:paddedJson};
 const totalLength=12+chunks.reduce((sum,chunk)=>sum+8+chunk.data.length,0);
 const output=new ArrayBuffer(totalLength),outView=new DataView(output),out=new Uint8Array(output);
 outView.setUint32(0,0x46546c67,true);outView.setUint32(4,2,true);outView.setUint32(8,totalLength,true);
 let cursor=12;
 for(const chunk of chunks){outView.setUint32(cursor,chunk.data.length,true);outView.setUint32(cursor+4,chunk.type,true);out.set(chunk.data,cursor+8);cursor+=8+chunk.data.length;}
 return output;
}
document.getElementById("export").onclick=async()=>{
 try{
  status.textContent="VRM 1.0を書き出しています…";
  const exporter=new GLTFExporter();
  const glb=await exporter.parseAsync(root,{binary:true,onlyVisible:true});
  const vrm=attachVrm10Extension(glb);
  const blob=new Blob([vrm],{type:"model/gltf-binary"});
  const url=URL.createObjectURL(blob);const a=document.createElement("a");a.href=url;a.download="alvis-face-prototype.vrm";a.click();setTimeout(()=>URL.revokeObjectURL(url),1500);
  status.textContent="VRM 1.0を書き出しました。Humanoid骨格と表情・母音モーフを含みます。これは18号の完成モデルではなく制作試作です。";
 }catch(e){status.textContent="VRM書き出しに失敗: "+(e?.message||String(e));}
};
function resize(){const w=Math.max(1,host.clientWidth),h=Math.max(1,host.clientHeight);camera.aspect=w/h;camera.updateProjectionMatrix();renderer.setSize(w,h,false);}
const ro=new ResizeObserver(resize);ro.observe(host);resize();
let running=false,frameId=0;
function animate(){if(!running)return;frameId=requestAnimationFrame(animate);controls.update();renderer.render(scene,camera);}
function setRenderActive(active){if(active===running)return;running=active;if(running)animate();else if(frameId){cancelAnimationFrame(frameId);frameId=0;}}
document.addEventListener("visibilitychange",()=>setRenderActive(document.visibilityState==="visible"));
setRenderActive(document.visibilityState==="visible");
